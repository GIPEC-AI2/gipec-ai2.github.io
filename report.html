<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project SPEAR — Dossier</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf3;font:14.5px/1.6 Helvetica,Arial,sans-serif;color:#1b2533}
.bar{position:sticky;top:0;z-index:5;background:#0f2a5c;color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
.bar b{font-size:14px;letter-spacing:.3px;margin-right:auto}
.bar button{font:600 12.5px Helvetica,Arial,sans-serif;border:0;border-radius:7px;padding:8px 12px;background:#fff;color:#0f2a5c;cursor:pointer}
.bar button.pri{background:#3b82f6;color:#fff}
.bar button[disabled]{opacity:.55;cursor:default}
#st{font-size:12px;opacity:.85;width:100%;text-align:right}
.page{background:#fff;max-width:880px;margin:18px auto;padding:38px 46px 30px;box-shadow:0 2px 14px rgba(15,42,92,.10);border-radius:4px}
.msg{max-width:640px;margin:60px auto;background:#fff;padding:28px;border-radius:8px;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #c7d2e5;border-top-color:#1f5fd6;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.note{color:#5b6678;font-size:12px}
.pick{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.pick.on{display:flex}
.pick .box{background:#fff;border-radius:10px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.pgrid label{border:2px solid #dfe5ee;border-radius:8px;padding:6px;cursor:pointer;font-size:11px;color:#5b6678;display:block}
.pgrid label.on{border-color:#1f5fd6;background:#eef4ff}
.pgrid img{width:100%;border-radius:4px;display:block;min-height:60px;background:#f5f7fb}
@media (max-width:700px){.page{padding:22px 16px;margin:10px 0}}
@media print{body{background:#fff}.bar,.noprint,.pick{display:none!important}.page{box-shadow:none;margin:0;max-width:none;padding:0}}
</style>
</head>
<body>
<div class="bar noprint">
  <b>PROJECT SPEAR · Dossier</b>
  <select id="bFor" title="Who the report is for" style="font:600 12.5px Helvetica,Arial,sans-serif;border:0;border-radius:7px;padding:8px 10px;color:#0f2a5c"><option value="">Report for: automatic</option><option value="meta">Report for: Meta</option><option value="other">Report for: another platform</option><option value="le">Report for: law enforcement</option></select>
  <button id="bAdd" title="Add more screenshots of the same post, then rewrite">➕ Add screenshots</button>
  <button id="bRe">↻ Rewrite with AI</button>
  <button id="bCopy" title="Copy the four answers (Q1–Q4) as plain text, ready to paste into Meta’s form">📋 Copy Q1–Q4 for Meta</button>
 <button id="bAll" title="Copy the whole dossier as plain text">📄 Copy full dossier</button>
  <button id="bAppx" title="Show or hide the standard Project SPEAR appendix">Appendix</button>
  <button id="bHtml">⬇ HTML</button>
  <button id="bPdf" class="pri">⬇ PDF</button>
  <button onclick="window.print()">🖨 Print</button>
  <span id="st"></span>
</div>
<div id="root"><div class="msg"><span class="spin"></span>Loading…</div></div>
<div class="pick" id="pick"><div class="box">
  <h3 style="margin-top:0">Add screenshots of the same post</h3>
  <div class="note">Pick other screenshots or frames of this same post. They are read together, so text split across frames is rebuilt. Up to 6.</div>
  <div class="pgrid" id="pgrid"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button id="pCancel" style="font:600 13px Helvetica;padding:8px 14px;border-radius:7px;border:1px solid #c9d6f3;background:#fff;color:#1f5fd6;cursor:pointer">Cancel</button><button id="pGo" style="font:600 13px Helvetica;padding:8px 14px;border-radius:7px;border:0;background:#1f5fd6;color:#fff;cursor:pointer">Write the report with these</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="spear-brand.js"></script>
<script src="spear-report.js"></script>
<script>
/* Full analyst report for one post (one or several screenshots). The report is written on the server
   (POST /api/deep-report) from the permanently archived images, saved there, and can be reopened,
   edited in place, and downloaded from any device. */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let API='https://project-spear-backend.onrender.com',KEY='';
try{const u=new URLSearchParams(location.search);const k=(u.get('key')||'').trim();if(k){localStorage.setItem('spear_key',k);u.delete('key');history.replaceState(null,'',location.pathname+'?'+u.toString())}
  API=(localStorage.getItem('spear_api')||API).replace(/\/$/,'');KEY=localStorage.getItem('spear_key')||''}catch(e){}
const P=new URLSearchParams(location.search);
let CASES=(P.get('cases')||'').split(',').map(s=>s.trim()).filter(Boolean),RID=P.get('id')||'',R=null,EDITS={},IMGS={};
const author=()=>{try{return localStorage.getItem('spear_author')||'Eric Feinberg'}catch(e){return 'Eric Feinberg'}};
const H=(x)=>Object.assign({'X-Spear-Key':KEY},x||{});
async function jget(p){const r=await fetch(API+p,{headers:H()});if(!r.ok)throw new Error(r.status);return r.json()}
const say=h=>{$('root').innerHTML='<div class="msg">'+h+'</div>'};
const status=t=>{$('st').textContent=t||''};

async function start(){
  if(!KEY){say('<b>This browser isn’t connected to the Project Spear server yet.</b><br>Open your Project Spear setup link once on this device, then reopen this page.');return}
  try{
    if(RID){const j=await jget('/api/deep-report/'+encodeURIComponent(RID));return show(j)}
    if(!CASES.length&&P.get('local'))return writeLocal(P.get('local'));
    if(!CASES.length&&P.get('sha'))return writeSha(P.get('sha'));
if(!CASES.length){say('<b>No case selected.</b><br>Open this from a case in the dashboard.');return}
    const l=await jget('/api/deep-reports?case='+encodeURIComponent(CASES[0]));
    const want=[...CASES].sort().join(',');
    const hit=CASES.length===1?(l.reports||[])[0]:(l.reports||[]).find(x=>[...x.case_ids].sort().join(',')===want);   // one case: its newest report, even one shared with other screenshots of the post
    if(hit){const j=await jget('/api/deep-report/'+hit.id);return show(j)}
    return writeNew();
  }catch(e){say('<b>Could not load the report.</b><br>'+esc(e.message)+'<br><br><button onclick="start()">Try again</button>')}
}
/* A case that has not reached the server yet: write the SPEAR Dossier from the picture held by the
dashboard tab that opened this page (nothing is lost if the browser could not sync the case). */
/* A picture SPEAR kept that is not attached to a case (Upload history -> Other saved pictures). */
async function writeSha(sha){
if(!/^[0-9a-f]{64}$/.test(String(sha||''))){say('<b>Picture not found.</b>');return}
say('<span class="spin"></span>Loading the saved picture…');
let img='';try{const r=await fetch(API+'/api/history/picture/'+sha,{headers:H()});if(!r.ok)throw new Error(r.status);const b=await r.blob();img=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}
catch(e){say('<b>The saved picture could not be loaded.</b><br>'+esc(e.message)+'<br><br><button onclick="writeSha(P.get(\'sha\'))">Try again</button>');return}
say('<span class="spin"></span>Writing the SPEAR Dossier from this picture… this takes about 1–2 minutes.');
let last='';
for(let a=0;a<3;a++){
try{const r=await fetch(API+'/api/deep-report',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({images:[img],author:author(),save:false,audience:FOR||'meta'})});
if(r.ok){const j=await r.json();IMGS['']=img;LOCALIMG=img;await show({id:'',report:j.report,edits:{},case_ids:[]});status('Written '+new Date().toLocaleString()+' · from a saved picture — download the PDF to keep this dossier');return}
let d='';try{d=(await r.json()).detail||''}catch(e){}
last=d||('error '+r.status);if([400,403,404,413].includes(r.status))break;
}catch(e){last='Could not reach the server — it may be waking up.'}
say('<span class="spin"></span>The AI is busy — trying again (attempt '+(a+2)+' of 3)…');await new Promise(res=>setTimeout(res,15000));
}
say('<b>The dossier was not written.</b><br>'+esc(last)+'<br><br><button onclick="writeSha(P.get(\'sha\'))">Try again</button>');
}
async function writeLocal(id){
let it=null;try{it=window.opener&&window.opener.spearGetItem?window.opener.spearGetItem(isNaN(+id)?id:+id):null}catch(e){}
if(!it||!/^data:image\//.test(String(it.thumb||''))){say('<b>Case not found.</b><br>Keep the Project Spear dashboard tab open and click <b>SPEAR Dossier</b> on the case again.');return}
say('<span class="spin"></span>Writing the SPEAR Dossier from this screenshot… this takes about 1–2 minutes.');
const meta=it.meta===true||/facebook|instagram|threads|whatsapp|messenger/i.test([it.source_app,it.platform,it.url].join(' '));
let last='';
for(let a=0;a<3;a++){
try{const r=await fetch(API+'/api/deep-report',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({images:[it.thumb],author:author(),analyst_notes:String(it.notes||''),save:false,audience:FOR||(meta?'meta':undefined)})});
if(r.ok){const j=await r.json();IMGS['']=it.thumb;LOCALIMG=it.thumb;await show({id:'',report:j.report,edits:{},case_ids:[]});status('Written '+new Date().toLocaleString()+' · this case has not synced to the server yet, so download the PDF to keep this dossier');return}
let d='';try{d=(await r.json()).detail||''}catch(e){}
last=d||('error '+r.status);if([400,403,404,413].includes(r.status))break;
}catch(e){last='Could not reach the server — it may be waking up.'}
say('<span class="spin"></span>The AI is busy — trying again (attempt '+(a+2)+' of 3)…');await new Promise(res=>setTimeout(res,15000));
}
say('<b>The dossier was not written.</b><br>'+esc(last)+'<br><br><button onclick="writeLocal(P.get(\'local\'))">Try again</button>');
}
async function writeNew(allowText){
  say('<span class="spin"></span>'+(allowText?'Writing the intelligence brief from the captured text':'Writing the full analyst report from '+CASES.length+' screenshot'+(CASES.length>1?'s':''))+'… this takes about 1–2 minutes.');
  let last='';
  for(let a=0;a<3;a++){
    try{
      const r=await fetch(API+'/api/deep-report',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({case_ids:CASES,author:author(),allow_text:!!allowText,audience:FOR||undefined})});
      if(r.ok){const j=await r.json();RID=j.id;history.replaceState(null,'','?id='+j.id);return show({id:j.id,report:j.report,edits:{},case_ids:j.report.case_ids})}
      let d='';try{d=(await r.json()).detail||''}catch(e){}
      last=d||('error '+r.status);
      if(r.status===404&&/text brief available/.test(d)){say('<b>No screenshot is stored for this post.</b><br>SPEAR can still write the intelligence brief from the captured text and link.<br><br><button onclick="writeNew(true)">🧾 Write the brief from the text</button>');return}
      if([400,403,404].includes(r.status))break;
    }catch(e){last='Could not reach the server — it may be waking up.'}
    say('<span class="spin"></span>The AI is busy — trying again (attempt '+(a+2)+' of 3)…');await new Promise(res=>setTimeout(res,15000));
  }
  say('<b>The report was not written.</b><br>'+esc(last)+'<br><br><button onclick="writeNew()">Try again</button>');
}
async function loadImgs(rep){
  for(const ev of rep.evidence||[]){if(!ev.case_id||IMGS[ev.case_id])continue;
    try{const r=await fetch(API+'/api/evidence/'+encodeURIComponent(ev.case_id),{headers:H()});if(!r.ok)continue;
      const b=await r.blob();IMGS[ev.case_id]=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}catch(e){}}
}
async function show(j){
  R=j.report;EDITS=j.edits||{};RID=j.id||RID;CASES=j.case_ids||R.case_ids||CASES;
  if(R&&R.audience==='le'){FOR='le';$('bFor').value='le'}
  await loadImgs(R);render();
  $('bCopy').textContent=SpearReport.copyLabel?SpearReport.copyLabel(R):'📋 Copy Q1–Q4 for Meta';
  status('Written '+new Date(R.written_at||Date.now()).toLocaleString()+(j.updated_at&&Object.keys(EDITS).length?' · edited '+new Date(j.updated_at).toLocaleString():''));
}
function render(){
  const ap=$('pg')&&$('pg').classList.contains('with-appx');
  document.title='Project SPEAR — '+(R.title||(R.report_type==='brief'?'Intelligence Brief':'Analyst Report'));
  $('root').innerHTML='<div class="page sr'+(ap?' with-appx':'')+'" id="pg">'+SpearReport.render(R,{edits:EDITS,imgs:IMGS,author:author(),teach:true})+'<p class="noprint note" style="margin-top:16px">Click any paragraph to edit it. Edits are saved on the server with the report.</p></div>';
  if(SpearReport.wireLearning)SpearReport.wireLearning($('pg'),{base:API,key:KEY,by:author(),reportId:RID,caseIds:CASES});
  document.querySelectorAll('#pg [contenteditable]').forEach(el=>el.addEventListener('input',queueSave));
try{askPaint()}catch(e){}
}
let saveT=null;
function queueSave(e){const el=e.target.closest('[data-k]');if(!el)return;EDITS[el.dataset.k]=el.innerHTML;status('Saving…');clearTimeout(saveT);saveT=setTimeout(saveEdits,1200)}
async function saveEdits(){if(!RID){status('Not saved — this report has no id');return}
  try{const r=await fetch(API+'/api/deep-report/'+RID+'/edits',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({edits:EDITS})});status(r.ok?'Saved '+new Date().toLocaleTimeString():'Not saved ('+r.status+')')}catch(e){status('Not saved — offline')}}

function fname(ext){const a=String((R&&R.account)||'case').replace(/^@/,'').replace(/[^A-Za-z0-9._-]+/g,'_');return `SPEAR_Report_${a}_${new Date().toISOString().slice(0,10)}.${ext}`}
$('bHtml').onclick=()=>{if(!R)return;const pg=$('pg').cloneNode(true);pg.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));pg.querySelectorAll('.noprint').forEach(e=>e.remove());
  if(!$('pg').classList.contains('with-appx'))pg.querySelectorAll('.appx').forEach(e=>e.remove());
  const css=document.querySelector('style').outerHTML+'<style>'+document.getElementById('sr-css').textContent+'</style>';const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(document.title)}</title>${css}</head><body style="background:#fff">${pg.outerHTML}</body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=fname('html');document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)};
$('bPdf').onclick=async()=>{if(!R)return;if(typeof html2pdf!=='function'){status('PDF tool did not load — use Print, then Save as PDF');return}
  const b=$('bPdf');b.disabled=true;b.textContent='⏳ Making PDF…';
  const pg=$('pg').cloneNode(true);pg.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));pg.querySelectorAll('.noprint').forEach(e=>e.remove());
  if(!$('pg').classList.contains('with-appx'))pg.querySelectorAll('.appx').forEach(e=>e.remove());
  pg.style.boxShadow='none';pg.style.margin='0';pg.style.padding='0';pg.style.width='672px';pg.style.maxWidth='672px';   /* narrower than the 711px PDF page: browsers zoomed out (Ctrl -) otherwise clip the right edge */
  try{await html2pdf().set({margin:[14,14,16,14],filename:fname('pdf'),image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'letter',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['h2','h3','.tac','.des','.ib','.verdict','li','figure','.kv']}}).from(pg).toPdf().get('pdf').then(pdf=>{if(window.SpearBrand)SpearBrand.stamp(pdf,R&&R.report_type==='brief'?'Project SPEAR // Intelligence Brief':'Project SPEAR // Dossier')}).save()}
  catch(e){status('PDF failed — use Print, then Save as PDF')}
  b.disabled=false;b.textContent='⬇ PDF'};
$('bAll').onclick=()=>{const p=$('pg');if(!p)return;navigator.clipboard.writeText(SpearReport.fullText?SpearReport.fullText(p):p.innerText).then(()=>status('Full dossier copied'),()=>status('Copy blocked by the browser'))};
$('bAppx').onclick=()=>{const p=$('pg');if(!p)return;p.classList.toggle('with-appx');$('bAppx').textContent=p.classList.contains('with-appx')?'Hide appendix':'Appendix'};
$('bCopy').onclick=()=>{const p=$('pg');if(!p)return;const t=SpearReport.metaText(p);navigator.clipboard.writeText(t).then(()=>status(R&&R.report_type==='brief'?'Brief copied':'Q1–Q4 copied — paste into Meta’s form'),()=>status('Copy blocked by the browser'))};
/* Who the report is for: Meta, another platform, or a law-enforcement agency (adds the law-enforcement brief). */
var FOR='';
$('bFor').onchange=()=>{FOR=$('bFor').value;if(!R)return;RID='';EDITS={};if(CASES.length)writeNew(R&&R.from_text);else if(P.get('local'))writeLocal(P.get('local'));};
let armed=false;
$('bRe').onclick=()=>{if(Object.keys(EDITS).length&&!armed){armed=true;status('Press “Rewrite with AI” again to replace this report (your edits stay on the old one)');return}armed=false;RID='';EDITS={};writeNew(R&&R.from_text)};
/* add screenshots of the same post */
let PICK=new Set();
$('bAdd').onclick=async()=>{$('pick').classList.add('on');PICK=new Set(CASES);const g=$('pgrid');g.innerHTML='<div class="note"><span class="spin"></span>Loading recent screenshots…</div>';
  try{const ix=await jget('/api/evidence-index');const list=Object.entries(ix.files||{}).filter(([k,v])=>/^image\//.test(v.mime||'')).sort((a,b)=>String(b[1].stored_at).localeCompare(String(a[1].stored_at))).slice(0,18);
    g.innerHTML=list.map(([id,v])=>`<label class="${PICK.has(id)?'on':''}" data-id="${esc(id)}"><input type="checkbox" ${PICK.has(id)?'checked':''}><img data-src="${esc(id)}" alt=""><div>${esc(v.name||'image')}<br>${esc(new Date(v.stored_at).toLocaleString())}</div></label>`).join('')||'<div class="note">No archived screenshots yet.</div>';
    for(const im of g.querySelectorAll('img[data-src]')){const id=im.dataset.src;if(IMGS[id]){im.src=IMGS[id];continue}
      try{const r=await fetch(API+'/api/evidence/'+encodeURIComponent(id),{headers:H()});if(r.ok)im.src=URL.createObjectURL(await r.blob())}catch(e){}
      await new Promise(res=>setTimeout(res,350))}
  }catch(e){g.innerHTML='<div class="note">Could not load the archive: '+esc(e.message)+'</div>'}};
$('pgrid').addEventListener('click',e=>{const l=e.target.closest('label');if(!l)return;e.preventDefault();const id=l.dataset.id;
  if(PICK.has(id))PICK.delete(id);else if(PICK.size<6)PICK.add(id);l.classList.toggle('on',PICK.has(id))});
$('pCancel').onclick=()=>$('pick').classList.remove('on');
$('pGo').onclick=()=>{if(!PICK.size)return;$('pick').classList.remove('on');CASES=[...PICK];RID='';EDITS={};history.replaceState(null,'','?cases='+CASES.join(','));writeNew()};
/* Ask SPEAR (Nov 2026): a conversation with the AI about this post, in the same window as the post
and the dossier, like the analyst's Gemini chat. A question gets a direct answer in seconds
(POST /api/ask-spear); nothing is rewritten. "Put this in the dossier" sends the conversation to the
dossier writer as the analyst's correction, and the whole dossier is rewritten with it (about a minute).
The conversation stays listed here for this case on this device. */
let LOCALIMG='';
function askKey(){return 'spear_ask_'+(CASES.length?[...CASES].sort().join(','):(P.get('local')||RID||'x'))}
function askLog(){try{return JSON.parse(localStorage.getItem(askKey())||'[]')}catch(e){return []}}
function askSave(l){try{localStorage.setItem(askKey(),JSON.stringify(l.slice(-40)))}catch(e){}}
function askImgs(){const v=Object.values(IMGS).filter(x=>/^data:image\//.test(String(x)));if(LOCALIMG&&!v.includes(LOCALIMG))v.unshift(LOCALIMG);return v}
function askDossier(){if(!R)return '';const v=R.verdict||{};
  return [R.title||'', 'Category: '+(R.category||'')+' · risk '+(R.risk_score!=null?R.risk_score+'/10':''), v.answer||'', v.summary||'',
    (R.missed&&R.missed.intro)?'Why Meta missed it: '+R.missed.intro:''].filter(Boolean).join('\n').slice(0,3500)}
const ASK_CSS='<style>'+
 '#askfab{position:fixed;right:18px;bottom:112px;z-index:30;font:800 17px Helvetica,Arial,sans-serif;background:#2f7d5b;color:#fff;border:0;border-radius:30px;padding:15px 22px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}'+
 '#askbar{max-width:880px;margin:14px auto 0;display:flex;gap:10px;align-items:center;background:#f1faf5;border:2px solid #2f7d5b;border-radius:10px;padding:10px 14px;font:15px/1.4 Helvetica,Arial,sans-serif;color:#1a4d37}'+
 '#askbar b{font-size:16px}#askbar button{margin-left:auto;font:800 15px Helvetica,Arial,sans-serif;background:#2f7d5b;color:#fff;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;white-space:nowrap}'+
 '#askp{position:fixed;z-index:40;background:#fff;display:none;flex-direction:column;font:15px/1.5 Helvetica,Arial,sans-serif;color:#1b2533;box-shadow:-6px 0 24px rgba(15,42,92,.18)}'+
 '#askp.on{display:flex}#askp .hd{display:flex;align-items:center;gap:8px;background:#2f7d5b;color:#fff;padding:12px 14px}#askp .hd b{font-size:18px}'+
 '#askp .hd button{margin-left:auto;font:700 15px Helvetica;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}'+
 '#askp .im{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#f5f7fb;border-bottom:1px solid #e3e8f0}#askp .im img{height:120px;border-radius:6px;border:1px solid #d6dde8;flex:none}'+
 '#askp .lg{flex:1;overflow-y:auto;padding:12px}#askp .m{max-width:92%;margin:0 0 10px;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}'+
 '#askp .m.y{margin-left:auto;background:#0f2a5c;color:#fff;border-bottom-right-radius:4px}#askp .m.s{background:#f1faf5;border:1px solid #bfe3cf;border-bottom-left-radius:4px}'+
 '#askp .m.u{background:#fff8e6;border:1px solid #f1d58a;font-size:13.5px}#askp .m .ad{display:block;margin-top:8px;font:700 13px Helvetica;background:#fff;color:#2f7d5b;border:1.5px solid #2f7d5b;border-radius:7px;padding:6px 10px;cursor:pointer}'+
 '#askp .hint{color:#5b6678;font-size:13.5px;margin:0 0 10px}#askp .ft{border-top:1px solid #e3e8f0;padding:10px 12px;background:#fafbfd}'+
 '#askp textarea{width:100%;box-sizing:border-box;font:15px Helvetica,Arial,sans-serif;border:1.5px solid #c9d6f3;border-radius:9px;padding:10px;min-height:62px;resize:vertical}'+
 '#askp .rw{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}#askp .go{font:800 16px Helvetica;background:#2f7d5b;color:#fff;border:0;border-radius:9px;padding:11px 20px;cursor:pointer}'+
 '#askp .up{font:700 13px Helvetica;background:#fff;color:#0f2a5c;border:1.5px solid #0f2a5c;border-radius:9px;padding:9px 12px;cursor:pointer}#askp button:disabled{opacity:.55;cursor:default}'+
 '#askp .st{font-size:13px;color:#5b6678;width:100%}'+
 '@media (min-width:1100px){#askp{top:0;right:0;bottom:0;width:400px}body.askopen{padding-right:400px}body.askopen #askfab{display:none}body.askopen #svBtn{right:418px!important}body.askopen #svPanel{right:418px!important}}'+
 '@media (max-width:1099px){#askp{left:0;right:0;bottom:0;height:86vh;border-radius:14px 14px 0 0}body.askopen #askfab,body.askopen #svBtn,body.askopen #svPanel{display:none!important}}'+
 '@media print{#askfab,#askbar,#askp{display:none!important}body.askopen{padding-right:0}}'+
 '</style>';
function askPaint(){
  if(!$('askp')){
    const css=document.createElement('div');css.innerHTML=ASK_CSS;document.head.appendChild(css.firstChild);
    const bar=document.createElement('div');bar.id='askbar';bar.className='noprint';
    bar.innerHTML='<span>💬</span><span><b>Ask SPEAR about this post</b><br>Ask anything — “Is that the Al-Furqan logo?” — and get an answer in seconds, next to the post.</span><button type="button">Ask SPEAR</button>';
    $('root').insertAdjacentElement('beforebegin',bar);bar.querySelector('button').onclick=askOpen;
    const fab=document.createElement('button');fab.id='askfab';fab.type='button';fab.className='noprint';fab.textContent='💬 Ask SPEAR';fab.onclick=askOpen;document.body.appendChild(fab);
    const p=document.createElement('div');p.id='askp';p.className='noprint';
    p.innerHTML='<div class="hd"><b>💬 Ask SPEAR</b><span style="font-size:13px;opacity:.9">about this post</span><button type="button" id="askX">Close ✕</button></div>'+
      '<div class="im" id="askIm"></div><div class="lg" id="askLog"></div>'+
      '<div class="ft"><textarea id="askQ" maxlength="2000" placeholder="Ask or correct SPEAR… e.g. Is that the Al-Furqan logo in the upper-left corner?"></textarea>'+
      '<div class="rw"><button type="button" class="go" id="askGo">Ask</button><button type="button" class="up" id="askUp" title="Rewrite the whole dossier using this conversation (about a minute)">↻ Update the dossier with this chat</button><span class="st" id="askSt"></span></div></div>';
    document.body.appendChild(p);
    $('askX').onclick=()=>{p.classList.remove('on');document.body.classList.remove('askopen')};
    $('askGo').onclick=askSend;$('askUp').onclick=()=>askApply(null);
    $('askQ').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();askSend()}});
    $('askLog').addEventListener('click',e=>{const b=e.target.closest('.ad');if(b)askApply(+b.dataset.i)});
  }
  const ims=askImgs();$('askIm').innerHTML=ims.slice(0,6).map(s=>'<img alt="post" src="'+esc(s)+'">').join('');$('askIm').style.display=ims.length?'flex':'none';
  const log=askLog();
  $('askLog').innerHTML=(log.length?'':'<p class="hint">Talk to SPEAR the way you talk to Gemini. Ask what something is, ask why Meta missed it, or tell it what it got wrong. Answers come back in seconds. When an answer belongs in the report, press <b>Put this in the dossier</b>.</p>')+
    log.map((x,i)=>x.who==='you'?'<div class="m y">'+esc(x.t)+'</div>':
      x.kind==='update'?'<div class="m u">'+esc(x.t)+'</div>':
      '<div class="m s"><b style="color:#1a4d37">SPEAR:</b> '+askMd(x.t)+(x.kind==='answer'?'<button type="button" class="ad" data-i="'+i+'">✚ Put this in the dossier</button>':'')+'</div>').join('');
  const lg=$('askLog');lg.scrollTop=lg.scrollHeight;
}
/* the AI sometimes answers with **bold** / *italic*: show it as formatting, never as raw HTML */
function askMd(s){return esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')}
function askOpen(){askPaint();$('askp').classList.add('on');document.body.classList.add('askopen');setTimeout(()=>{try{$('askQ').focus()}catch(e){}},50)}
async function askSend(){
  const q=$('askQ').value.trim();if(q.length<2||!R)return;
  const prev=askLog();const log=prev.concat([{who:'you',t:q}]);askSave(log);$('askQ').value='';askPaint();
  const b=$('askGo');b.disabled=true;$('askSt').innerHTML='<span class="spin"></span>SPEAR is looking at the post…';
  const body={question:q,history:prev.filter(x=>x.kind!=='update').slice(-12).map(x=>({who:x.who,t:x.t})),dossier:askDossier()};
  if(CASES.length)body.case_ids=CASES;else body.images=askImgs().slice(0,6);
  let ans='',last='';
  for(let a=0;a<3&&!ans;a++){
    try{const r=await fetch(API+'/api/ask-spear',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify(body)});
      if(r.ok){ans=(await r.json()).answer||'';break}
      let d='';try{d=(await r.json()).detail||''}catch(e){}last=d||('error '+r.status);
      /* case not on the server any more: ask about the pictures shown in this dossier */
      if(r.status===404&&body.case_ids){const im=askImgs();if(im.length){delete body.case_ids;body.images=im.slice(0,6);a--;continue}}
      if([400,403,404,413].includes(r.status))break;
    }catch(e){last='Could not reach the server — it may be waking up.'}
    $('askSt').textContent='The AI is busy — trying again ('+(a+2)+' of 3)…';await new Promise(res=>setTimeout(res,6000));
  }
  const l2=askLog();l2.push(ans?{who:'spear',kind:'answer',t:ans}:{who:'spear',kind:'update',t:'No answer: '+last});askSave(l2);
  b.disabled=false;$('askSt').textContent='';askPaint();
}
/* Rewrite the dossier with the conversation (one answer, or the whole chat). */
async function askApply(i){
  const log=askLog();const chat=log.filter(x=>x.kind!=='update');
  let use;
  if(i==null)use=chat;else{const k=chat.indexOf(log[i]);use=chat.slice(Math.max(0,k-1),k+1)}
  if(!use.length){$('askSt').textContent='Ask SPEAR something first.';return}
  const convo=use.map(x=>(x.who==='you'?'ANALYST: ':'SPEAR: ')+x.t).join('\n');
  const v=R.verdict||{};
  const notes='THE ANALYST DISCUSSED THIS POST WITH SPEAR. Treat the analyst\'s statements as corrections and SPEAR\'s confirmed answers as findings. Update every section they affect (description, decoded meaning, verdict, category, why Meta missed it, how SPEAR catches it, terms, Q1-Q4).\n'+convo+
    '\n\nPrevious draft for reference: '+(R.title||'')+' — '+(v.answer||'')+' '+(v.summary||'');
  const body={author:author(),analyst_notes:notes.slice(0,2900),audience:FOR||(R.report_type==='brief'?'other':'meta')};
  if(CASES.length){body.case_ids=CASES;body.save=true}else{body.images=askImgs().slice(0,6);body.save=false}
  document.querySelectorAll('#askp .ad,#askUp').forEach(x=>x.disabled=true);
  $('askSt').innerHTML='<span class="spin"></span>Rewriting the dossier with this — about a minute. You can keep reading.';
  let ok=false,last='';
  for(let a=0;a<3&&!ok;a++){
    try{const r=await fetch(API+'/api/deep-report',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify(body)});
      if(r.ok){const j=await r.json();ok=true;
        if(j.id){RID=j.id;history.replaceState(null,'','?id='+j.id)}else RID='';
        await show({id:j.id||'',report:j.report,edits:{},case_ids:j.report.case_ids&&j.report.case_ids.length?j.report.case_ids:CASES});
        const nv=(j.report.verdict||{}).answer||'';const l2=askLog();l2.push({who:'spear',kind:'update',t:'✓ Dossier updated'+(nv?' — '+nv:'')+'.'});askSave(l2);
        status('Updated from the chat '+new Date().toLocaleTimeString()+(j.id?' · saved':' · download the PDF to keep it'));break}
      let d='';try{d=(await r.json()).detail||''}catch(e){}last=d||('error '+r.status);
      if(r.status===404&&body.case_ids){const im=askImgs();if(im.length){delete body.case_ids;body.images=im.slice(0,6);body.save=false;a--;continue}}
      if([400,403,404,413].includes(r.status))break;
    }catch(e){last='Could not reach the server — it may be waking up.'}
    $('askSt').textContent='The AI is busy — trying again ('+(a+2)+' of 3)…';await new Promise(res=>setTimeout(res,12000));
  }
  if(!ok){const l2=askLog();l2.push({who:'spear',kind:'update',t:'Dossier not updated: '+last});askSave(l2)}
  $('askSt').textContent='';askPaint();
}
start();
</script>
<script id="spear-nav">
/* The Project SPEAR control panel: the same left-hand menu on every page, same colours as the
   Operational dashboard, so Eric can go from any page to any other in one click. */
(function(){
  if(document.getElementById('spside'))return;
  var P=location.pathname.split('/').pop()||'index.html';
  var here=/brand\.html$/.test(P)?'brand':/(report|brief)\.html$/.test(P)?'reports':'analysis';
  var G='#2f7d5b',O='#c96a12',B='#1f5bb0',N='#0f2a5c',PU='#6a3fb5',M='#9c2a62';
  var items=[];try{items=JSON.parse(localStorage.getItem('spear_items')||'[]')||[]}catch(e){}
  var live=items.filter(function(i){return !i.archived});
  var cnt={all:live.filter(function(i){return !i.status||i.status==='Pending'}).length,approved:live.filter(function(i){return i.status==='Confirmed'}).length,
    specialist:live.filter(function(i){return i.status==='Escalated'}).length,reported:live.filter(function(i){return i.reportedAt}).length,archive:items.filter(function(i){return i.archived}).length};
  function a(k,href,ic,label,c,n){return '<a class="sn'+(k===here?' on':'')+'" href="'+href+'" style="--c:'+c+'"><span class="ic">'+ic+'</span><span class="tx">'+label+'</span>'+(n?'<span class="ct">'+n+'</span>':'')+'</a>'}
  function g(t,c){return '<div class="sg"'+(c?' style="--c:'+c+'"':'')+'>'+(c?'<i></i>':'')+t+'</div>'}
  var html='<div class="sb"><a href="ops.html#ops" style="color:inherit;text-decoration:none">Project Spear</a><small>CONTENT MODERATION PLATFORM</small></div>'+
    g('Dashboards')+a('ops','ops.html#ops','▦','Operational view',G)+a('exec','ops.html#exec','↗','Executive view',O)+
    g('Case management',B)+a('analysis','./','✳','Agent analysis',N)+a('brand','brand.html','◆','Brand safety',PU)+
    a('all','ops.html#all','☰','All open cases',B,cnt.all)+a('approved','ops.html#approved','✓','Human approved',B,cnt.approved)+
    a('specialist','ops.html#specialist','◷','Specialist queue',B,cnt.specialist)+a('reported','ops.html#reported','▤','Reported to Meta',B,cnt.reported)+
    a('takedown','ops.html#takedown','⤓','Takedowns',B)+a('meta','ops.html#meta','ⓜ','Meta files',B)+a('archive','ops.html#archive','🗂','Archive',B,cnt.archive)+a('history','history.html','🕘','Upload history',B)+
    g('Business',G)+a('licenses','licenses.html','🔑','Customers &amp; licenses',G)+a('trendsw','trends.html','📣','Trends Watch',G)+g('Agent management',M)+a('cost','ops.html#cost','$','Cost analysis',M)+a('console','ops.html#console','⌘','Agent console',M)+a('memory','ops.html#memory','◈','Agent memory',M)+
    '<details class="sw"><summary>'+g('Analyst workspace',N)+'</summary>'+
    a('x','./#capture','⊕','Capture &amp; analyze',N)+a('x','./#tab=ai','✦','AI chat',N)+a('x','./#tab=log','▣','Log',N)+a('x','./#tab=cb','✎','Codebook &amp; teach',N)+a('slurs','slurs.html','⬆','Upload new slurs',N)+a('x','./#tab=lib','▥','Library',N)+a('x','./#tab=hunt','◎','Active Hunt',N)+'</details>';
  var css='#spside{position:fixed;left:0;top:0;bottom:0;width:224px;background:#f5f7fb;border-right:1px solid #e3e8ef;overflow-y:auto;padding:14px 10px 24px;z-index:900;font:14px/1.2 Inter,system-ui,"Segoe UI",Arial,sans-serif;box-sizing:border-box}'+
    'html body{padding-left:224px!important}'+
    '#spside .sb{font:800 19px/1.1 Inter,system-ui,Arial,sans-serif;color:#0f1d33;padding:2px 8px 14px}#spside .sb small{display:block;font:600 9.5px/1.4 ui-monospace,Menlo,monospace;letter-spacing:1.6px;color:#6b7785;margin-top:3px}'+
    '#spside .sg{display:flex;align-items:center;gap:7px;font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:1.4px;text-transform:uppercase;color:var(--c,#8a94a3);margin:16px 8px 6px}#spside .sg i{width:8px;height:8px;border-radius:2px;background:var(--c)}'+
    '#spside a.sn{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:1px 0;border-radius:8px;color:var(--c);text-decoration:none;font-weight:600}'+
    '#spside a.sn .ic{width:18px;text-align:center;font-weight:700}#spside a.sn .ct{margin-left:auto;font:700 11px ui-monospace,Menlo,monospace;color:#6b7785}'+
    '#spside a.sn:hover{background:#fff}#spside a.sn.on{background:#fff;box-shadow:inset 4px 0 0 var(--c),0 1px 3px rgba(15,42,92,.1);color:var(--c)}'+
    '#spside details.sw summary{list-style:none;cursor:pointer}#spside details.sw summary::-webkit-details-marker{display:none}#spside details.sw summary .sg::after{content:"▸";margin-left:4px}#spside details.sw[open] summary .sg::after{content:"▾"}'+
    '#spmenu{display:none;position:fixed;left:10px;top:10px;z-index:901;font:700 13px/1 Inter,Arial,sans-serif;background:#0f1d33;color:#fff;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}'+
    '@media (max-width:900px){html body{padding-left:0!important}#spside{transform:translateX(-105%);transition:transform .2s;box-shadow:6px 0 24px rgba(0,0,0,.18)}#spside.open{transform:none}#spmenu{display:block}}'+
    '@media print{#spside,#spmenu{display:none!important}html body{padding-left:0!important}}'+
    /* the menu now carries these links, so the page headers stay clean */
    'header a[href="ops.html"],header a[href="brand.html"],.top a[href="ops.html"],.top a[href="./"]{display:none!important}';
  var st=document.createElement('style');st.id='spside-css';st.textContent=css;document.head.appendChild(st);
  var n=document.createElement('nav');n.id='spside';n.setAttribute('aria-label','Project SPEAR menu');n.innerHTML=html;
  document.body.insertBefore(n,document.body.firstChild);
  var b=document.createElement('button');b.id='spmenu';b.type='button';b.textContent='☰ Menu';b.onclick=function(){n.classList.toggle('open')};document.body.appendChild(b);
  var old=document.getElementById('spnav');if(old)old.remove();
})();
</script>
