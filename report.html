<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project SPEAR — Analyst Report</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf3;font:14.5px/1.6 Helvetica,Arial,sans-serif;color:#1b2533}
.bar{position:sticky;top:0;z-index:5;background:#0f2a5c;color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
.bar b{font-size:14px;letter-spacing:.3px;margin-right:auto}
.bar button{font:600 12.5px Helvetica,Arial,sans-serif;border:0;border-radius:7px;padding:8px 12px;background:#fff;color:#0f2a5c;cursor:pointer}
.bar button.pri{background:#3b82f6;color:#fff}
.bar button[disabled]{opacity:.55;cursor:default}
#st{font-size:12px;opacity:.85;width:100%;text-align:right}
.page{background:#fff;max-width:880px;margin:18px auto;padding:38px 46px 30px;box-shadow:0 2px 14px rgba(15,42,92,.10);border-radius:4px}
.msg{max-width:640px;margin:60px auto;background:#fff;padding:28px;border-radius:8px;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #c7d2e5;border-top-color:#1f5fd6;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.note{color:#5b6678;font-size:12px}
.pick{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.pick.on{display:flex}
.pick .box{background:#fff;border-radius:10px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.pgrid label{border:2px solid #dfe5ee;border-radius:8px;padding:6px;cursor:pointer;font-size:11px;color:#5b6678;display:block}
.pgrid label.on{border-color:#1f5fd6;background:#eef4ff}
.pgrid img{width:100%;border-radius:4px;display:block;min-height:60px;background:#f5f7fb}
@media (max-width:700px){.page{padding:22px 16px;margin:10px 0}}
@media print{body{background:#fff}.bar,.noprint,.pick{display:none!important}.page{box-shadow:none;margin:0;max-width:none;padding:0}}
</style>
</head>
<body>
<div class="bar noprint">
  <b>PROJECT SPEAR · Analyst Report</b>
  <button id="bAdd" title="Add more screenshots of the same post, then rewrite">➕ Add screenshots</button>
  <button id="bRe">↻ Rewrite with AI</button>
  <button id="bCopy" title="Copy the four answers (Q1–Q4) as plain text, ready to paste into Meta’s form">📋 Copy Q1–Q4 for Meta</button>
  <button id="bAppx" title="Show or hide the standard Project SPEAR appendix">Appendix</button>
  <button id="bHtml">⬇ HTML</button>
  <button id="bPdf" class="pri">⬇ PDF</button>
  <button onclick="window.print()">🖨 Print</button>
  <span id="st"></span>
</div>
<div id="root"><div class="msg"><span class="spin"></span>Loading…</div></div>
<div class="pick" id="pick"><div class="box">
  <h3 style="margin-top:0">Add screenshots of the same post</h3>
  <div class="note">Pick other screenshots or frames of this same post. They are read together, so text split across frames is rebuilt. Up to 6.</div>
  <div class="pgrid" id="pgrid"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button id="pCancel" style="font:600 13px Helvetica;padding:8px 14px;border-radius:7px;border:1px solid #c9d6f3;background:#fff;color:#1f5fd6;cursor:pointer">Cancel</button><button id="pGo" style="font:600 13px Helvetica;padding:8px 14px;border-radius:7px;border:0;background:#1f5fd6;color:#fff;cursor:pointer">Write the report with these</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="spear-report.js"></script>
<script>
/* Full analyst report for one post (one or several screenshots). The report is written on the server
   (POST /api/deep-report) from the permanently archived images, saved there, and can be reopened,
   edited in place, and downloaded from any device. */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let API='https://project-spear-backend.onrender.com',KEY='';
try{const u=new URLSearchParams(location.search);const k=(u.get('key')||'').trim();if(k){localStorage.setItem('spear_key',k);u.delete('key');history.replaceState(null,'',location.pathname+'?'+u.toString())}
  API=(localStorage.getItem('spear_api')||API).replace(/\/$/,'');KEY=localStorage.getItem('spear_key')||''}catch(e){}
const P=new URLSearchParams(location.search);
let CASES=(P.get('cases')||'').split(',').map(s=>s.trim()).filter(Boolean),RID=P.get('id')||'',R=null,EDITS={},IMGS={};
const author=()=>{try{return localStorage.getItem('spear_author')||'Eric Feinberg'}catch(e){return 'Eric Feinberg'}};
const H=(x)=>Object.assign({'X-Spear-Key':KEY},x||{});
async function jget(p){const r=await fetch(API+p,{headers:H()});if(!r.ok)throw new Error(r.status);return r.json()}
const say=h=>{$('root').innerHTML='<div class="msg">'+h+'</div>'};
const status=t=>{$('st').textContent=t||''};

async function start(){
  if(!KEY){say('<b>This browser isn’t connected to the Project Spear server yet.</b><br>Open your Project Spear setup link once on this device, then reopen this page.');return}
  try{
    if(RID){const j=await jget('/api/deep-report/'+encodeURIComponent(RID));return show(j)}
    if(!CASES.length){say('<b>No case selected.</b><br>Open this from a case in the dashboard.');return}
    const l=await jget('/api/deep-reports?case='+encodeURIComponent(CASES[0]));
    const want=[...CASES].sort().join(',');
    const hit=CASES.length===1?(l.reports||[])[0]:(l.reports||[]).find(x=>[...x.case_ids].sort().join(',')===want);   // one case: its newest report, even one shared with other screenshots of the post
    if(hit){const j=await jget('/api/deep-report/'+hit.id);return show(j)}
    return writeNew();
  }catch(e){say('<b>Could not load the report.</b><br>'+esc(e.message)+'<br><br><button onclick="start()">Try again</button>')}
}
async function writeNew(){
  say('<span class="spin"></span>Writing the full analyst report from '+CASES.length+' screenshot'+(CASES.length>1?'s':'')+'… this takes about 1–2 minutes.');
  let last='';
  for(let a=0;a<3;a++){
    try{
      const r=await fetch(API+'/api/deep-report',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({case_ids:CASES,author:author()})});
      if(r.ok){const j=await r.json();RID=j.id;history.replaceState(null,'','?id='+j.id);return show({id:j.id,report:j.report,edits:{},case_ids:j.report.case_ids})}
      let d='';try{d=(await r.json()).detail||''}catch(e){}
      last=d||('error '+r.status);if([400,403,404].includes(r.status))break;
    }catch(e){last='Could not reach the server — it may be waking up.'}
    say('<span class="spin"></span>The AI is busy — trying again (attempt '+(a+2)+' of 3)…');await new Promise(res=>setTimeout(res,15000));
  }
  say('<b>The report was not written.</b><br>'+esc(last)+'<br><br><button onclick="writeNew()">Try again</button>');
}
async function loadImgs(rep){
  for(const ev of rep.evidence||[]){if(!ev.case_id||IMGS[ev.case_id])continue;
    try{const r=await fetch(API+'/api/evidence/'+encodeURIComponent(ev.case_id),{headers:H()});if(!r.ok)continue;
      const b=await r.blob();IMGS[ev.case_id]=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}catch(e){}}
}
async function show(j){
  R=j.report;EDITS=j.edits||{};RID=j.id||RID;CASES=j.case_ids||R.case_ids||CASES;
  await loadImgs(R);render();
  status('Written '+new Date(R.written_at||Date.now()).toLocaleString()+(j.updated_at&&Object.keys(EDITS).length?' · edited '+new Date(j.updated_at).toLocaleString():''));
}
function render(){
  const ap=$('pg')&&$('pg').classList.contains('with-appx');
  document.title='Project SPEAR — '+(R.title||'Analyst Report');
  $('root').innerHTML='<div class="page sr'+(ap?' with-appx':'')+'" id="pg">'+SpearReport.render(R,{edits:EDITS,imgs:IMGS,author:author()})+'<p class="noprint note" style="margin-top:16px">Click any paragraph to edit it. Edits are saved on the server with the report.</p></div>';
  document.querySelectorAll('#pg [contenteditable]').forEach(el=>el.addEventListener('input',queueSave));
}
let saveT=null;
function queueSave(e){const el=e.target.closest('[data-k]');if(!el)return;EDITS[el.dataset.k]=el.innerHTML;status('Saving…');clearTimeout(saveT);saveT=setTimeout(saveEdits,1200)}
async function saveEdits(){if(!RID){status('Not saved — this report has no id');return}
  try{const r=await fetch(API+'/api/deep-report/'+RID+'/edits',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({edits:EDITS})});status(r.ok?'Saved '+new Date().toLocaleTimeString():'Not saved ('+r.status+')')}catch(e){status('Not saved — offline')}}

function fname(ext){const a=String((R&&R.account)||'case').replace(/^@/,'').replace(/[^A-Za-z0-9._-]+/g,'_');return `SPEAR_Report_${a}_${new Date().toISOString().slice(0,10)}.${ext}`}
$('bHtml').onclick=()=>{if(!R)return;const pg=$('pg').cloneNode(true);pg.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));pg.querySelectorAll('.noprint').forEach(e=>e.remove());
  if(!$('pg').classList.contains('with-appx'))pg.querySelectorAll('.appx').forEach(e=>e.remove());
  const css=document.querySelector('style').outerHTML+'<style>'+document.getElementById('sr-css').textContent+'</style>';const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(document.title)}</title>${css}</head><body style="background:#fff">${pg.outerHTML}</body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=fname('html');document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)};
$('bPdf').onclick=async()=>{if(!R)return;if(typeof html2pdf!=='function'){status('PDF tool did not load — use Print, then Save as PDF');return}
  const b=$('bPdf');b.disabled=true;b.textContent='⏳ Making PDF…';
  const pg=$('pg').cloneNode(true);pg.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));pg.querySelectorAll('.noprint').forEach(e=>e.remove());
  if(!$('pg').classList.contains('with-appx'))pg.querySelectorAll('.appx').forEach(e=>e.remove());
  pg.style.boxShadow='none';pg.style.margin='0';pg.style.padding='0';
  try{await html2pdf().set({margin:[14,14,16,14],filename:fname('pdf'),image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'letter',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['h2','h3','.tac','.des','.ib','.verdict','li','figure','.kv']}}).from(pg).save()}
  catch(e){status('PDF failed — use Print, then Save as PDF')}
  b.disabled=false;b.textContent='⬇ PDF'};
$('bAppx').onclick=()=>{const p=$('pg');if(!p)return;p.classList.toggle('with-appx');$('bAppx').textContent=p.classList.contains('with-appx')?'Hide appendix':'Appendix'};
$('bCopy').onclick=()=>{const p=$('pg');if(!p)return;const t=SpearReport.metaText(p);navigator.clipboard.writeText(t).then(()=>status('Q1–Q4 copied — paste into Meta’s form'),()=>status('Copy blocked by the browser'))};
let armed=false;
$('bRe').onclick=()=>{if(Object.keys(EDITS).length&&!armed){armed=true;status('Press “Rewrite with AI” again to replace this report (your edits stay on the old one)');return}armed=false;RID='';EDITS={};writeNew()};
/* add screenshots of the same post */
let PICK=new Set();
$('bAdd').onclick=async()=>{$('pick').classList.add('on');PICK=new Set(CASES);const g=$('pgrid');g.innerHTML='<div class="note"><span class="spin"></span>Loading recent screenshots…</div>';
  try{const ix=await jget('/api/evidence-index');const list=Object.entries(ix.files||{}).filter(([k,v])=>/^image\//.test(v.mime||'')).sort((a,b)=>String(b[1].stored_at).localeCompare(String(a[1].stored_at))).slice(0,18);
    g.innerHTML=list.map(([id,v])=>`<label class="${PICK.has(id)?'on':''}" data-id="${esc(id)}"><input type="checkbox" ${PICK.has(id)?'checked':''}><img data-src="${esc(id)}" alt=""><div>${esc(v.name||'image')}<br>${esc(new Date(v.stored_at).toLocaleString())}</div></label>`).join('')||'<div class="note">No archived screenshots yet.</div>';
    for(const im of g.querySelectorAll('img[data-src]')){const id=im.dataset.src;if(IMGS[id]){im.src=IMGS[id];continue}
      try{const r=await fetch(API+'/api/evidence/'+encodeURIComponent(id),{headers:H()});if(r.ok)im.src=URL.createObjectURL(await r.blob())}catch(e){}
      await new Promise(res=>setTimeout(res,350))}
  }catch(e){g.innerHTML='<div class="note">Could not load the archive: '+esc(e.message)+'</div>'}};
$('pgrid').addEventListener('click',e=>{const l=e.target.closest('label');if(!l)return;e.preventDefault();const id=l.dataset.id;
  if(PICK.has(id))PICK.delete(id);else if(PICK.size<6)PICK.add(id);l.classList.toggle('on',PICK.has(id))});
$('pCancel').onclick=()=>$('pick').classList.remove('on');
$('pGo').onclick=()=>{if(!PICK.size)return;$('pick').classList.remove('on');CASES=[...PICK];RID='';EDITS={};history.replaceState(null,'','?cases='+CASES.join(','));writeNew()};
start();
</script>
</body>
</html>
